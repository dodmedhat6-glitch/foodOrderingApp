name: core-service-test

services:
  postgres-test:
    image: postgis/postgis:18-3.6
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD:  test #replace with a secure password in production
      POSTGRES_DB: DODS.test
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d 'DODS.test'"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis-test:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq-test:
    image: rabbitmq:3.13-alpine
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "status"]
      interval: 10s
      timeout: 10s
      retries: 10

  tests:
    build:
      context: .
      target: test
    image: core-service-test
    environment:
      NODE_ENV: test
      PORT: "3001"

      DB_HOST: postgres-test
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: test
      DB_NAME: DODS.test
      DB_POOL_MAX: "5"
      DB_MIGRATIONS_DIRECTORY: src/migrations
      DB_MIGRATIONS_EXTENSION: ts

      ACCESS_SECRET: test-access-secret
      REFRESH_SECRET: test-refresh-secret
      ACCESS_EXPIRATION: "3600"
      REFRESH_EXPIRATION: "86400"

      CORS_ORIGIN: http://localhost:3000

      REDIS_HOST: redis-test
      REDIS_PORT: "6379"

      RABBIT_URL: amqp://guest:guest@rabbitmq-test:5672
      RABBIT_EXCHANGE: core.events
      RABBIT_BATCH_SIZE: "50"

      MAILJET_API_KEY: test
      MAILJET_SECRET_KEY: test
      MAILJET_FROM_EMAIL: test@example.com
      MAILJET_FROM_NAME: Test

      ORDER_SERVICE_API_KEY: test-order-service-api-key
    depends_on:
      postgres-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
      rabbitmq-test:
        condition: service_healthy

    command: sh -e -c "npm ci && npm run build && npm test && npm run test:integration"
