services:
  postgres:
    image: postgres:18
    container_name: quickbite_postgres
    restart: unless-stopped
    environment:
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        POSTGRES_DB: postgres
    ports:
        - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./scripts/docker/01.init.sql:/docker-entrypoint-initdb.d/01.init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      retries: 5
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.10-management-alpine
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics","-q","status"]
      interval: 10s
      retries: 5

  order-service:
    build: .
    env_file:
      - .env
    environment:
      DB_eg_HOST: postgres
      DB_sa_HOST: postgres
      ARCHIVE_DB_eg_HOST: postgres
      ARCHIVE_DB_sa_HOST: postgres
      REDIS_HOST: redis
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
  order-worker:
    build: .
    command: ["node", "dist/worker.js"]
    env_file:
      - .env
    environment:
      DB_eg_HOST: postgres
      DB_sa_HOST: postgres
      ARCHIVE_DB_eg_HOST: postgres
      ARCHIVE_DB_sa_HOST: postgres
      REDIS_HOST: redis
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
volumes:
    postgres_data:
    rabbitmq_data: