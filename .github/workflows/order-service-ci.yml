name: Order Service CI

on:
  push:
    branches: [main]
    paths:
      - "../../order-service"
      - ".github/workflows/order-service-core-serivce-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "../../order-service"
      - ".github/workflows/order-service-core-serivce-ci.yml"
  workflow_dispatch:

jobs:
  build:
    name: Typecheck and Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: order-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: order-service/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build